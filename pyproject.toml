[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS — personal AI agent platform (LangGraph gateway in Docker + host CLI/TUI/bridge)"
requires-python = ">=3.11"
# Host-side tools only (CLI, TUI, bridge). The gateway/runner/browser deps live in requirements-*.txt (Docker images).
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "textual>=0.80",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2",
]

[project.optional-dependencies]
bridge = ["mss>=9", "pywinauto>=0.6.8; sys_platform == 'win32'", "pyautogui>=0.9.54"]
build = ["pyinstaller>=6"]
dev = ["pytest>=8"]

[project.scripts]
agentos = "cli.main:main"

[tool.setuptools]
packages = ["cli", "bridge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
