# AgentOS stack. Start with `agentos start` (or `docker compose up -d --build`).
# Only 127.0.0.1 ports are published: gateway 7860 (UI + API) and noVNC 6080 (via novnc-edge).
# User folder mounts live in docker-compose.mounts.yml (generated by `agentos mount add`); see docs/DOCKER.md.
name: agentos

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  gateway:
    <<: *hardening
    build: { context: ., dockerfile: docker/gateway.Dockerfile }
    image: agentos/gateway:latest
    ports: ["127.0.0.1:7860:7860"]
    environment:
      AAP_DATA_DIR: /data
      AAP_RUNNER_URL: http://runner:8001
      AAP_BROWSER_URL: http://browser:8002
      AAP_BRIDGE_URL: http://host.docker.internal:8765
      AAP_LLM_BASE_URL: ${AAP_LLM_BASE_URL:-http://host.docker.internal:20128/v1}
      AAP_LLM_API_KEY: ${AAP_LLM_API_KEY:-none}
      AAP_LLM_MODEL: ${AAP_LLM_MODEL:-}
      AAP_VNC_PUBLIC_URL: http://127.0.0.1:6080/vnc.html?autoconnect=1&resize=scale
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes:
      - aos_data:/data
      - aos_egress:/data/egress          # gateway writes allowlist.extra; egress reloads it
    read_only: true
    tmpfs: ["/tmp:size=256m"]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    networks: [internal, edge]
    depends_on:
      runner: { condition: service_started }
      browser: { condition: service_started }

  runner:
    <<: *hardening
    build: { context: ., dockerfile: docker/runner.Dockerfile }
    image: agentos/runner:latest
    environment:
      RUNNER_ROOTS: /workspace:/shared:/mounts:/tmp
      RUNNER_RO_PATHS: ${RUNNER_RO_PATHS:-}
      HTTP_PROXY: http://egress:3128
      HTTPS_PROXY: http://egress:3128
      http_proxy: http://egress:3128
      https_proxy: http://egress:3128
      NO_PROXY: localhost,127.0.0.1,gateway,browser,runner
      PIP_INDEX_URL: https://pypi.org/simple
    volumes:
      - aos_workspace:/workspace
      - ${AOS_SHARED:-C:/Users/raman/AgentOS/shared}:/shared
    read_only: true
    tmpfs:
      - /tmp:size=1g,exec,uid=1000,gid=1000
      - /home/agent:size=1g,exec,uid=1000,gid=1000
    mem_limit: 4g
    cpus: 2.0
    pids_limit: 512
    networks: [internal]                 # no direct internet: only the egress proxy

  browser:
    <<: *hardening
    build: { context: ., dockerfile: docker/browser.Dockerfile }
    image: agentos/browser:latest
    environment:
      PROFILES_DIR: /profiles
      BROWSER_HEADLESS: "false"
      BROWSER_PROXY: http://egress:3128
      VNC_PASSWORD: ${VNC_PASSWORD:-}
    volumes:
      - aos_profiles:/profiles
    shm_size: 1gb
    tmpfs: ["/tmp:size=512m,exec"]
    mem_limit: 3g
    cpus: 2.0
    pids_limit: 1024
    networks: [internal]

  egress:
    <<: *hardening
    build: { context: ., dockerfile: docker/egress.Dockerfile }
    image: agentos/egress:latest
    cap_add: ["SETUID", "SETGID"]   # tinyproxy drops root -> tinyproxy user
    environment:
      EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-}
    volumes:
      - aos_egress:/config
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    networks: [internal, edge]

  # Ports cannot be published from an `internal: true` network, so this tiny relay exposes the browser's
  # noVNC on 127.0.0.1:6080 without giving the browser container itself an internet-facing interface.
  novnc-edge:
    <<: *hardening
    image: alpine/socat:1.8.0.0
    command: ["TCP-LISTEN:6080,fork,reuseaddr", "TCP:browser:6080"]
    ports: ["127.0.0.1:6080:6080"]
    mem_limit: 64m
    cpus: 0.25
    pids_limit: 64
    networks: [internal, edge]
    depends_on: [browser]

networks:
  internal:
    internal: true
  edge: {}

volumes:
  aos_data: {}
  aos_workspace: {}
  aos_profiles: {}
  aos_egress: {}
